name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew :player:service:testDebugUnitTest :sources:youtubemusic:test :sources:api:test --no-daemon --console=plain 2>&1 | tee test_out.log || {
            awk '/\* What went wrong:|e: file:|> Task .* FAILED/{flag=1} flag && NF {print "::error::" $0}' test_out.log | head -n 9
            exit 1
          }

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon -Ppodium.minifyDebug=true -Ppodium.abi=arm64-v8a --console=plain 2>&1 | tee build_out.log || {
            awk '/\* What went wrong:|e: file:|> Task .* FAILED/{flag=1} flag && NF {print "::error::" $0}' build_out.log | head -n 9
            exit 1
          }

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: podium-ytm-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-debug --yes || true
          gh release create latest-debug app/build/outputs/apk/debug/app-debug.apk \
            --title "Podium YTM Debug APK" \
            --notes "Latest automated build (${{ github.sha }})" \
            --latest
